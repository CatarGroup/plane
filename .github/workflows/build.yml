name: Build y publicar imagen (arm64)

# Construye el overlay de Plane y lo publica en ghcr.io.
# SOLO arm64 y en un runner ARM NATIVO (ubuntu-24.04-arm): el VPS de produccion es
# Hetzner CAX (aarch64) y ya no se despliega en Railway, asi que no hace falta amd64.
# Sin QEMU: compilar emulando ARM tardaba mas de una hora.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar el frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/catargroup/plane-web:v1.4.2
            ghcr.io/catargroup/plane-web:${{ github.sha }}

  build:
    needs: build-web
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/catargroup/plane:latest
            ghcr.io/catargroup/plane:${{ github.sha }}
