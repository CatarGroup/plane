name: Build y publicar imagen

# Construye la imagen del overlay (Plane en español + tema) y la publica
# en el registro de GitHub (ghcr.io). Railway usa esa imagen como Source,
# así nunca se pierde nuestra personalización en los redeploys.
#
# Todo vive en la rama main: el overlay (Dockerfile, scripts, templates,
# tema) Y el codigo fuente completo de Plane (apps/, packages/), asi que
# un solo push aqui dispara todo. build-web compila el frontend desde ese
# mismo codigo fuente y publica esa imagen ANTES: el Dockerfile principal
# la usa para sustituir el frontend oficial (ver su paso 0).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar el frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/catargroup/plane-web:v1.4.2
            ghcr.io/catargroup/plane-web:${{ github.sha }}

  build:
    needs: build-web
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/catargroup/plane:latest
            ghcr.io/catargroup/plane:${{ github.sha }}

      # una vez publicada la imagen, decimos a Railway que redespliegue
      - name: Redesplegar en Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          curl -sf -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"4ef8a5d7-29b2-4e06-8642-3ecae6a9196e\", serviceId: \"ac22c055-2f1a-48d1-aa8c-bd7f773df098\") }"}'
          echo "Redeploy lanzado en Railway"
